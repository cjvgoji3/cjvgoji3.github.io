    <body>
        <span> <a href="index.html">Home</a> | <a href="bulb.html">Bulb</a> | <a href="form.html">Form</a> |</span> 
        <div id="result"></div>

        <script>
            //this statement prints text to the screen
            document.write("Hello Kitty!" + "<br>");
            //create variable
            var value1 = 60;
            var value2 = 70;
            var sum = value1 + value2;
            document.write(sum + "<br>");
            //connect to words together, this is called concatenation
            var string1 = "Chocolate "
            var string2 = "Brownie"
            document.write(string1 + string2);
            //select an HTML element by id and manipulate it
            document.getElementById("result").innerHTML = "Whazzuuuuppppp!";
            document.getElementById("result").innerText = "HELLOOOOOO!!!";
            //select an HTML element by id and change its style
            document.getElementById("result").style = "font-size: 20px; color: red";
            
            //alert
            window.alert("HEYY WATCH OUT!!!");

        </script>
    </body>

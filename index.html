<!DOCTYPE html>
<head>
    <title>Quiz</title>
</head>
<body>
    <h1>Country Quiz</h1>
    <p>which country are you from?</p>
<form>
    <input type="radio" name="country" value="U.S.A">
    <label for="country"> From U.S.A </label><br>
    <input type="radio" name="country" value="Mexico">
    <label for="country"> From Mexico</label><br>

    <p>Have you visited either country?</p>

    <input type="checkbox" name="Mexico" value="visited Mexico">
    <label for="Mexico">Have visited Mexico</label><br>
    <input type="checkbox" name="U.S.A" value="visited U.S.A">
    <label for="U.S.A">Have visited U.S.A</label><br>
</form>
</body>
</html>
